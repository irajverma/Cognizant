server:
  port: 9090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Route to greet-service
        - id: greet_route
          uri: lb://greet-service
          predicates:
            - Path=/greet-service/**
          filters:
            - StripPrefix=1

        # Route to account-service
        - id: account_route
          uri: lb://account-service
          predicates:
            - Path=/account-service/**
          filters:
            - StripPrefix=1
            - name: CustomRateLimiter

        # Route to loan-service
        - id: loan_route
          uri: lb://loan-service
          predicates:
            - Path=/loan-service/**
          filters:
            - StripPrefix=1

        # Resilient Route for Payment Service under loan-service
        - id: payment_route
          uri: lb://loan-service
          predicates:
            - Path=/payment-service/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: paymentCircuitBreaker
                fallbackUri: forward:/payment-fallback

        # Centralized Auth service route
        - id: auth_route
          uri: lb://auth-service
          predicates:
            - Path=/auth-service/**
          filters:
            - StripPrefix=1

# Discovery Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Resilience4j Config properties
resilience4j:
  circuitbreaker:
    instances:
      paymentCircuitBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 5
        failureRateThreshold: 50
        minimumNumberOfCalls: 3
        waitDurationInOpenState: 10000

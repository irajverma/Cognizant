server:
  port: 8081

spring:
  application:
    name: loan-service
  datasource:
    url: jdbc:h2:mem:loandb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# Enable feign client capabilities
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
